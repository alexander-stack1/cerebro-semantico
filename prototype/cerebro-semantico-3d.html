<!doctype html>
<!--
  CÉREBRO SEMÂNTICO INTERATIVO 3D
  ================================
  Arquivo único, pronto para abrir no navegador (duplo clique ou servidor estático).

  Stack:
    - Three.js r160 (ES modules via importmap, CDN jsDelivr)
    - Addons: OrbitControls, EffectComposer, RenderPass, UnrealBloomPass, OutputPass
    - GSAP 3.12.5 (transições de câmera, pulsos e tweens de uniforms)
    - GLSL próprio: nós com ruído simplex + fresnel, sinapses Catmull-Rom calculadas na GPU,
      fótons e partículas com sprites procedurais.

  Arquitetura (resumo):
    1. DADOS        Dois JSON internos: BRAIN_DATA (grafo gerado por pipeline/build_graph.py e injetado por
                    pipeline/embed_viewer.py; no repositório, o vault fictício de examples/) e MOCK_GRAPH
                    (exemplo mínimo escrito à mão). O botão "Ver exemplo" alterna.
                    Troque por outro com CerebroSemantico.setData(json).
    2. CÉREBRO      Córtex procedural (hemisférios com giros e sulcos, fissura, cerebelo, tronco) em vidro
                    translúcido, ≈13 mil pontos de luz nos giros e ≈2.400 neurônios internos ligados por fibras
                    com pulsos. Cada categoria ocupa um lobo; a área do campo ativo acende no córtex.
    2b. FÍSICA      Molas de Hooke prendem cada neurônio ao seu lobo; molas fracas entre neurônios ligados.
    2c. TEMPO       Linha do tempo semanal. Calor de cada tema = registros datados com meia-vida de 3 semanas;
                    define tamanho e brilho do neurônio, força das sinapses e o mapa de calor dos lobos.
    3. NÓS          Uma Mesh por nó, geometria compartilhada, ShaderMaterial com displacement e fresnel.
    4. SINAPSES     UMA InstancedMesh (1 draw call) de tubos. A curva Catmull-Rom é avaliada no vertex shader
                    com a mesma fórmula do THREE.CatmullRomCurve3 ('catmullrom', tension 0.5).
    5. FÓTONS       Quads instanciados (1 draw call) que viajam pelas curvas. Posições via CatmullRomCurve3.getPoint.
    6. DISPARO      Pool fixo de partículas (sem alocação no clique) + casca de onda de choque.
    7. INTERAÇÃO    Raycast sob demanda contra esferas analíticas (O(n), sem testar triângulos).
    8. CICLO DE VIDA disposeGraph() e destroy() liberam geometrias, materiais, texturas e listeners.

  API global (para integrar com dados reais):
    window.CerebroSemantico.setData(json)   reconstrói o grafo com outro JSON (mesmo formato do MOCK_GRAPH)
    window.CerebroSemantico.select(id)      ativa um nó por id ou pelo nome
    window.CerebroSemantico.reset()         volta à visão geral
    window.CerebroSemantico.destroy()       desmonta tudo (útil dentro de SPA)
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cérebro Semântico 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Import map: resolve "three" e "three/addons/" para versões fixas -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<!-- GSAP clássico (global window.gsap). Carrega antes do módulo, que é diferido. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<style>
  /* Layout: cena WebGL em tela cheia, HUD de vidro fosco nas bordas, painel lateral do nó ativo.
     Tema único escuro por escolha (cena cósmica): cores explícitas e color-scheme dark. */
  :root{
    color-scheme:dark;
    --bg:#04050a;
    --ink:rgba(236,240,255,.94);
    --muted:rgba(196,206,232,.56);
    --faint:rgba(196,206,232,.32);
    --line:rgba(255,255,255,.09);
    --glass:rgba(10,12,22,.58);
    --glass-strong:rgba(10,12,22,.78);
    --latent:#ffd27a;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
  #scene{position:fixed;inset:0;touch-action:none}
  #scene canvas{display:block;width:100%;height:100%;outline:none}
  /* vinheta: escurece as bordas e dá profundidade "cósmica" */
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,transparent 52%,rgba(0,0,0,.55) 82%,rgba(0,0,0,.85) 100%)}
  /* grão fino sobre a imagem (textura analógica) */
  .grain{position:fixed;inset:-50%;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain 1.2s steps(6) infinite}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(0,0)}}

  /* ---------- rótulos flutuantes (DOM projetado do 3D) ---------- */
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .label{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;white-space:nowrap;
    font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
    padding:6px 11px 6px 9px;border-radius:999px;background:rgba(6,8,16,.5);
    border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;transition:opacity .35s ease, font-size .3s ease, padding .3s ease;will-change:transform,opacity}
  .label i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c),0 0 2px var(--c)}
  .label.big{font-size:13px;padding:8px 14px 8px 11px;border-color:color-mix(in srgb,var(--c) 55%,transparent)}
  .label small{font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--muted);text-transform:none}

  /* ---------- HUD ---------- */
  .hud{position:fixed;top:calc(22px + env(safe-area-inset-top,0px));left:calc(24px + env(safe-area-inset-left,0px));max-width:min(560px,calc(100vw - 48px));pointer-events:none}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--faint)}
  .hud h1{margin:8px 0 6px;font-size:28px;font-weight:500;letter-spacing:-.025em;line-height:1}
  .stats{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;pointer-events:auto}
  .chip{font:inherit;font-size:12px;color:var(--ink);display:inline-flex;align-items:center;gap:8px;
    padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.035);border:1px solid var(--line);
    cursor:pointer;transition:background .2s,border-color .2s,opacity .2s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .chip:hover{background:rgba(255,255,255,.08)}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
  .chip.on{background:rgba(255,255,255,.12);border-color:color-mix(in srgb,var(--c) 70%,transparent)}
  .chip.mute{opacity:.45}
  .chip[hidden]{display:none}
  .chip b{font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--muted)}

  .toolbar{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .toolbar .chip[aria-pressed="true"]{background:rgba(255,255,255,.12)}
  .fps{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:6px}
  .hint{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));top:calc(72px + env(safe-area-inset-top,0px));max-width:300px;text-align:right;line-height:1.6;font-family:var(--mono);font-size:11px;
    color:var(--faint);letter-spacing:.04em;pointer-events:none;transition:opacity .6s}

  /* busca */
  .search{position:fixed;top:calc(22px + env(safe-area-inset-top,0px));right:calc(24px + env(safe-area-inset-right,0px));width:260px}
  .search input{width:100%;font:inherit;font-size:13px;color:var(--ink);padding:10px 14px 10px 36px;border-radius:999px;
    background:var(--glass);border:1px solid var(--line);outline:none;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .search input:focus{border-color:rgba(255,255,255,.28)}
  .search svg{position:absolute;left:13px;top:11px;width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8}
  .sugg{list-style:none;margin:6px 0 0;padding:6px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:none}
  .sugg.on{display:block}
  .sugg button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:10px;
    font-size:13px;cursor:pointer;color:var(--ink)}
  .sugg button:hover,.sugg button.kb{background:rgba(255,255,255,.08)}
  .sugg i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
  .sugg span{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}

  /* painel do nó ativo */
  .panel{position:fixed;top:calc(78px + env(safe-area-inset-top,0px));right:calc(24px + env(safe-area-inset-right,0px));width:340px;max-height:calc(100% - 210px);overflow:auto;padding:22px;
    border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);opacity:0;transform:translateX(16px);pointer-events:none;
    transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1);scrollbar-width:thin}
  .panel.open{opacity:1;transform:none;pointer-events:auto}
  .p-cat{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--muted)}
  .p-cat i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
  .p-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin:-6px 0 14px}
  .panel h2{margin:10px 0 14px;font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.02}
  .meter{display:grid;grid-template-columns:52px 1fr 40px;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  .bar{height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar b{display:block;height:100%;border-radius:99px;background:var(--c);box-shadow:0 0 12px var(--c)}
  .mono{font-family:var(--mono);font-size:11px;color:var(--ink);text-align:right}
  .p-sub{margin:16px 0 8px;font-size:12px;color:var(--muted);line-height:1.5}
  .conns{list-style:none;margin:0;padding:0}
  .conns button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:10px 1fr 62px 34px;align-items:center;gap:10px;
    padding:9px 8px;border-radius:12px;cursor:pointer;font-size:13px}
  .conns button:hover{background:rgba(255,255,255,.06)}
  .conns i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
  .conns em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--latent);margin-left:6px}
  .ghost{all:unset;cursor:pointer;margin-top:16px;display:inline-flex;font-size:12px;color:var(--muted);padding:8px 12px;border-radius:999px;border:1px solid var(--line)}
  .ghost:hover{color:var(--ink);background:rgba(255,255,255,.05)}

  /* linha do tempo semanal */
  .timeline{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:440px;
    display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;padding:10px 14px 10px 10px;border-radius:20px;
    background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .tl-play{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--line)}
  .tl-play:hover{background:rgba(255,255,255,.14)}
  .tl-play:focus-visible,.tl-bars button:focus-visible,.timeline input:focus-visible{outline:2px solid rgba(255,255,255,.5);outline-offset:2px}
  .tl-play svg{width:14px;height:14px;fill:var(--ink)}
  .tl-head{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .tl-head b{font-weight:500;color:var(--ink)}
  .tl-bars{display:flex;align-items:flex-end;gap:3px;height:26px;margin:6px 0 4px}
  .tl-bars button{all:unset;cursor:pointer;flex:1;min-height:2px;border-radius:2px;background:rgba(255,255,255,.18);transition:background .2s}
  .tl-bars button:hover{background:rgba(255,255,255,.4)}
  .tl-bars button.on{background:#9fd8ff;box-shadow:0 0 10px rgba(159,216,255,.7)}
  .timeline input[type=range]{width:100%;margin:0;accent-color:#9fd8ff;height:14px}
  .p-spark{display:flex;align-items:flex-end;gap:2px;height:30px;margin:12px 0 4px}
  .p-spark i{flex:1;min-height:2px;border-radius:2px;background:color-mix(in srgb,var(--c) 45%,transparent)}
  .p-spark i.on{background:var(--c);box-shadow:0 0 8px var(--c)}
  .fallback{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--muted)}

  @media (max-width:760px){
    .hud h1{font-size:22px}
    .legend{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    .search{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));right:16px;left:16px;width:auto}
    .timeline{left:16px;right:16px;width:auto;bottom:calc(58px + env(safe-area-inset-bottom,0px))}
    .toolbar{left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    .toolbar .chip{flex:none}
    .fps,.hint{display:none}
    .panel{top:auto;bottom:calc(202px + env(safe-area-inset-bottom,0px));left:16px;right:16px;width:auto;max-height:34vh;transform:translateY(16px)}
    .hud{left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px))}
  }
  @media (prefers-reduced-motion:reduce){.grain{animation:none}}
</style>
</head>
<body>
  <div id="scene" aria-label="Grafo 3D interativo dos campos da vida"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div id="labels"></div>

  <header class="hud">
    <div class="eyebrow" id="eyebrow">Cognitive graph · sinapses semânticas</div>
    <h1>Cérebro Semântico</h1>
    <div class="stats" id="stats"></div>
    <nav class="legend" id="legend" aria-label="Categorias"></nav>
  </header>

  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar campo  ( / )" autocomplete="off" aria-label="Buscar campo">
    <ul class="sugg" id="sugg"></ul>
  </div>

  <aside class="panel" id="panel" aria-live="polite"></aside>

  <div class="toolbar">
    <button class="chip" id="btnReset">Visão geral</button>
    <button class="chip" id="btnOrbit" aria-pressed="true">Auto-órbita</button>
    <button class="chip" id="btnLabels" aria-pressed="false">Todos os rótulos</button>
    <button class="chip" id="btnRebuild">Reorganizar</button>
    <button class="chip" id="btnData">Ver exemplo</button>
    <span class="fps" id="fps"></span>
  </div>
  <div class="timeline" id="timeline" hidden>
    <button class="tl-play" id="tlPlay" aria-label="Reproduzir as semanas"><svg viewBox="0 0 16 16" id="tlIcon"><path d="M4 2.5v11l9-5.5z"/></svg></button>
    <div>
      <div class="tl-head"><span id="tlLabel"></span><span id="tlCount"></span></div>
      <div class="tl-bars" id="tlBars" role="group" aria-label="Registros datados por semana"></div>
      <input type="range" id="tlRange" min="0" max="0" step="1" value="0" aria-label="Semana">
    </div>
  </div>
  <div class="hint" id="hint">Arraste para orbitar · Role para aproximar · Clique em um campo para ativar · Esc volta</div>
  <div class="fallback" id="fallback">Este navegador não oferece WebGL. Abra em Chrome, Edge, Safari ou Firefox atualizados.</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const gsap = window.gsap;

/* =====================================================================================
   1. DADOS (MOCK DATA DO COGNITIVE GRAPH)
   -------------------------------------------------------------------------------------
   Formato:
     categories: { [chave]: { label, color } }
     nodes: [{ id, name, category, weight (0..1, importância visual), connections: [{ id, proximity (0.1..1.0) }] }]
   As conexões podem ser declaradas de um lado só. O normalizador cria a aresta não dirigida
   e, se ela aparecer duas vezes, mantém a maior proximidade.
   Proximidade abaixo de LATENT_THRESHOLD vira "conexão latente": quase invisível no repouso,
   acende quando um dos nós é ativado.
   ===================================================================================== */
const LATENT_THRESHOLD = 0.35;

const MOCK_GRAPH = {
  categories: {
    carreira:  { label: 'Carreira',        color: '#4C8DFF', lobe: 'frontalE' },
    projetos:  { label: 'Projetos',        color: '#FF4FB0', lobe: 'frontalD' },
    financas:  { label: 'Finanças',        color: '#A47BFF', lobe: 'parietalD' },
    saude:     { label: 'Saúde',           color: '#2FE0B0', lobe: 'parietalE' },
    relacoes:  { label: 'Relacionamentos', color: '#FFB547', lobe: 'limbico' },
    lazer:     { label: 'Lazer',           color: '#FF6B5A', lobe: 'posterior' },
    proposito: { label: 'Propósito',       color: '#E9E4FF', lobe: 'temporalD' }
  },
  nodes: [
    // ---- nós principais (hubs) ----
    { id: 'carreira',  name: 'Carreira',        category: 'carreira',  weight: 1.0,
      connections: [ { id: 'docencia', proximity: 0.6 }, { id: 'estudos', proximity: 0.65 }, { id: 'projetos', proximity: 0.55 },
                     { id: 'renda', proximity: 0.8 }, { id: 'legado', proximity: 0.4 }, { id: 'conteudo', proximity: 0.4 } ] },
    { id: 'saude',     name: 'Saúde',           category: 'saude',     weight: 1.0,
      connections: [ { id: 'sono', proximity: 0.75 }, { id: 'exercicio', proximity: 0.8 }, { id: 'saudeMental', proximity: 0.85 } ] },
    { id: 'financas',  name: 'Finanças',        category: 'financas',  weight: 1.0,
      connections: [ { id: 'renda', proximity: 0.9 }, { id: 'investimentos', proximity: 0.8 }, { id: 'casa', proximity: 0.75 },
                     { id: 'viagens', proximity: 0.32 } ] },
    { id: 'relacoes',  name: 'Relacionamentos', category: 'relacoes',  weight: 1.0,
      connections: [ { id: 'familia', proximity: 0.95 }, { id: 'amizades', proximity: 0.7 }, { id: 'casamento', proximity: 0.7 } ] },
    { id: 'projetos',  name: 'Projetos',        category: 'projetos',  weight: 1.0,
      connections: [ { id: 'empresa', proximity: 0.95 }, { id: 'conteudo', proximity: 0.6 }, { id: 'legado', proximity: 0.32 } ] },

    // ---- carreira ----
    { id: 'trabalho',  name: 'Trabalho Atual',  category: 'carreira',  weight: 0.92,
      connections: [ { id: 'financas', proximity: 0.92 }, { id: 'estresse', proximity: 0.88 }, { id: 'carreira', proximity: 0.9 },
                     { id: 'oficio', proximity: 0.8 }, { id: 'tempoLivre', proximity: 0.22 }, { id: 'familia', proximity: 0.28 },
                     { id: 'sono', proximity: 0.3 } ] },
    { id: 'oficio',    name: 'Ofício',          category: 'carreira',  weight: 0.78,
      connections: [ { id: 'renda', proximity: 0.75 }, { id: 'empresa', proximity: 0.5 }, { id: 'docencia', proximity: 0.45 } ] },
    { id: 'docencia',  name: 'Docência',        category: 'carreira',  weight: 0.58,
      connections: [ { id: 'estudos', proximity: 0.45 }, { id: 'proposito', proximity: 0.4 } ] },
    { id: 'estudos',   name: 'Estudos',         category: 'carreira',  weight: 0.55,
      connections: [ { id: 'produtos', proximity: 0.7 }, { id: 'empresa', proximity: 0.6 } ] },

// Ruído simplex 3D (Ian McEwan, Stefan Gustavson; Ashima Arts, licença MIT).
const GLSL_SIMPLEX = /* glsl */`
vec3 mod289(vec3 x){return x - floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x - floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+10.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0))
                 + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                 + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);

  vec3 n  = normalize(position);
  // base tangente para reconstruir a normal da superfície deformada por diferenças finitas
  vec3 tg = normalize(abs(n.y) < 0.99 ? cross(n, vec3(0.0, 1.0, 0.0)) : cross(n, vec3(1.0, 0.0, 0.0)));
  vec3 bt = normalize(cross(n, tg));
  float e = 0.015;
  vec3 p0 = displaced(n);
  vec3 p1 = displaced(n + tg * e);
  vec3 p2 = displaced(n + bt * e);
  vec3 nn = normalize(cross(p1 - p0, p2 - p0) + vec3(1e-7));
  if (dot(nn, n) < 0.0) nn = -nn;
  vDisp = disp(n);
  vObj = n;
  vec4 mv = modelViewMatrix * vec4(p0, 1.0);
  vViewPos = mv.xyz;
  vNormalV = normalize(normalMatrix * nn);
  gl_Position = projectionMatrix * mv;
}
`;

const NODE_FRAG = /* glsl */`
uniform vec3  uColor;
uniform float uTime;
uniform float uHover;
uniform float uPulse;
uniform float uNeighbor; // 0..1, brilho de vizinho do nó em foco
uniform float uDim;      // 0..1, esmaecimento para o fundo
uniform float uSeed;
uniform float uGain;     // ganho global (grafo denso usa menos para não estourar o bloom)
varying vec3 vNormalV;
varying vec3 vViewPos;
varying vec3 vObj;
varying float vDisp;
${GLSL_SIMPLEX}
void main(){
  vec3 N = normalize(vNormalV + vec3(1e-6));
  vec3 V = normalize(-vViewPos + vec3(1e-6));
  float ndv  = clamp(dot(N, V), 0.0, 1.0);
  float fres = pow(max(1.0 - ndv, 0.0), 2.4);             // borda luminosa (efeito fresnel)
  // filamentos internos: ruído "ridged" lembra dendritos dentro da matéria
  float n = fbm(vObj * 2.6 + vec3(uSeed, uTime * 0.12, uTime * 0.08));
  float veins = pow(max(1.0 - abs(n), 0.0), 7.0);
  float flicker = 0.75 + 0.25 * sin(uTime * 1.7 + uSeed * 3.1);
  // luz-chave suave só para dar volume
  vec3 L = normalize(vec3(0.45, 0.75, 0.55));
  float diff = clamp(dot(N, L) * 0.5 + 0.5, 0.0, 1.0);

  float energy = 1.0 + uHover * 0.9 + uNeighbor * 0.55 + uPulse * 2.4;
  vec3 col = uColor * 0.07                                  // interior profundo
           + uColor * diff * 0.2
           + uColor * veins * (0.5 * flicker) * (0.35 + 0.65 * ndv)
           + uColor * smoothstep(-0.3, 0.6, vDisp * 4.0) * 0.1   // cristas do displacement mais claras
           + uColor * fres * 1.45
           + vec3(1.0) * pow(fres, 5.0) * 0.3;
  col *= energy * uGain;
  col *= mix(1.0, 0.12, uDim);
  float alpha = mix(1.0, 0.32, uDim);
  gl_FragColor = vec4(col, alpha);
}
`;

/* ---------- 3.2 Sinapse: tubo instanciado cuja curva é avaliada na GPU ----------
   Cada instância recebe 3 pontos de controle (A, M, B). O vertex shader reproduz
   exatamente THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5).getPoint(t):
   pontos virtuais nas pontas (2A-M e 2B-M) e polinômio cúbico por segmento.
   Assim o CPU só envia 9 floats por aresta por quadro, sem reconstruir geometria. */
const EDGE_VERT = /* glsl */`
attribute vec3 aA;
attribute vec3 aM;
attribute vec3 aB;
attribute vec3 aColA;
attribute vec3 aColB;
attribute float aProx;
attribute float aVis;
attribute float aSeed;
uniform float uThickness;
varying float vT;
varying vec3  vCol;
varying float vVis;
varying float vProx;
varying float vFacing;
varying float vSeed;

void crSegment(vec3 p0, vec3 p1, vec3 p2, vec3 p3, float w, out vec3 P, out vec3 T){
  vec3 t0 = 0.5 * (p2 - p0);
  vec3 t1 = 0.5 * (p3 - p1);
  vec3 c2 = -3.0 * p1 + 3.0 * p2 - 2.0 * t0 - t1;
  vec3 c3 =  2.0 * p1 - 2.0 * p2 + t0 + t1;
  P = p1 + t0 * w + c2 * w * w + c3 * w * w * w;
  T = t0 + 2.0 * c2 * w + 3.0 * c3 * w * w;
}
void curve(float t, out vec3 P, out vec3 T){
  float p = t * 2.0;
  float seg = min(floor(p), 1.0);
  float w = p - seg;
  if (seg < 0.5) crSegment(2.0 * aA - aM, aA, aM, aB, w, P, T);
  else           crSegment(aA, aM, aB, 2.0 * aB - aM, w, P, T);
}
void main(){
  float t = position.x;      // 0..1 ao longo da curva
  float ang = position.y;    // ângulo ao redor do tubo
  vec3 P, T;
  curve(t, P, T);
  T = normalize(T + vec3(1e-6));
  vec3 up = abs(T.y) < 0.92 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
  vec3 N = normalize(cross(T, up));
  vec3 B = cross(T, N);
  // espessura variável: mais grossa junto aos nós, afina no meio, engrossa quando ativa
  float taper = 0.42 + 0.58 * pow(abs(2.0 * t - 1.0), 1.6);
  float strength = max(aProx, aVis * 0.8);
  float r = uThickness * (0.3 + strength * 0.95) * taper * (0.5 + aVis * 0.95);
  vec3 dir = cos(ang) * N + sin(ang) * B;
  vec4 mv = modelViewMatrix * vec4(P + dir * r, 1.0);
  vec3 nView = normalize(normalMatrix * dir + vec3(1e-6));
  vFacing = clamp(abs(dot(nView, normalize(-mv.xyz + vec3(1e-6)))), 0.0, 1.0);
  vT = t;
  vCol = mix(aColA, aColB, smoothstep(0.0, 1.0, t));
  vVis = aVis;
  vProx = aProx;
  vSeed = aSeed;
  gl_Position = projectionMatrix * mv;
}
`;

const EDGE_FRAG = /* glsl */`
uniform float uTime;
varying float vT;
varying vec3  vCol;
varying float vVis;
varying float vProx;
varying float vFacing;
varying float vSeed;
void main(){
  float core = pow(clamp(vFacing, 0.0, 1.0), 1.7);   // o eixo do tubo brilha, a borda some: parece linha de luz
  // faixas elétricas que correm pela sinapse
  float flow = fract(vT * 3.0 - uTime * (0.3 + vProx * 0.55) + vSeed);
  float band = smoothstep(0.0, 0.07, flow) * (1.0 - smoothstep(0.07, 0.24, flow));
  float energy = 0.6 + band * 1.1 * vVis;
  float strength = max(vProx, vVis * 0.8);
  float alpha = min(1.0, core * vVis * (0.35 + 0.9 * strength) * energy * 1.25);
  alpha *= smoothstep(0.0, 0.05, vT) * (1.0 - smoothstep(0.95, 1.0, vT));
  gl_FragColor = vec4(vCol * (0.55 + 1.7 * core * vVis), alpha);
}
`;

/* ---------- 3.3 Partículas luminosas (fótons e disparo) ----------
   Quads instanciados voltados para a câmera (billboards). Cada instância traz posição,
   cor, tamanho em mundo e alpha. Evita gl_PointSize e gl_PointCoord, que têm limite de
   tamanho variável entre GPUs (e quebram em alguns renderizadores por software). */
const GLOW_QUAD_VERT = /* glsl */`
attribute vec3 aOffset;     // centro da partícula (mundo)
attribute vec3 aColor;
attribute float aSize;      // diâmetro em unidades de mundo
attribute float aAlpha;
varying vec3 vColor;
varying float vAlpha;
varying vec2 vUv;
void main(){
  vec4 mv = modelViewMatrix * vec4(aOffset, 1.0);
  mv.xy += position.xy * aSize;          // expande o quad no espaço da câmera: sempre de frente
  vUv = position.xy + 0.5;
  vColor = aColor;
  vAlpha = aAlpha;
  gl_Position = projectionMatrix * mv;
}
`;
const GLOW_QUAD_FRAG = /* glsl */`
varying vec3 vColor;
varying float vAlpha;
varying vec2 vUv;
void main(){
  vec2 c = vUv - 0.5;
  float d2 = dot(c, c);
  if (d2 > 0.25 || vAlpha < 0.002) discard;
  float core = exp(-d2 * 70.0);
  float halo = exp(-d2 * 14.0) * 0.45;
  gl_FragColor = vec4(vColor * (core * 1.8 + halo), (core + halo) * vAlpha);
}
`;

/* ---------- 3.4 Poeira suspensa (líquido cefalorraquidiano) ----------
   Também em quads instanciados. A deriva roda inteira na GPU: o CPU não toca nesses dados. */
const DUST_VERT = /* glsl */`
attribute vec3 aOffset;
attribute float aSeed;
uniform float uTime;
varying float vA;
varying vec2 vUv;
void main(){
  vec3 p = aOffset;
  p += vec3(sin(uTime * 0.07 + aSeed * 6.28), cos(uTime * 0.05 + aSeed * 12.1), sin(uTime * 0.06 + aSeed * 3.7)) * 2.4;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  float size = 0.07 + fract(aSeed * 91.7) * 0.16;
  mv.xy += position.xy * size;
  vUv = position.xy + 0.5;
  vA = (0.25 + 0.75 * fract(aSeed * 53.3)) * (0.55 + 0.45 * sin(uTime * (0.4 + fract(aSeed * 7.0)) + aSeed * 40.0));
  vA *= smoothstep(1.5, 6.0, -mv.z);     // grãos colados na lente somem em vez de virar borrão
  gl_Position = projectionMatrix * mv;
}
`;
const DUST_FRAG = /* glsl */`
varying float vA;
varying vec2 vUv;
void main(){
  vec2 c = vUv - 0.5;
  float d2 = dot(c, c);
  if (d2 > 0.25) discard;
  float a = exp(-d2 * 16.0);
  gl_FragColor = vec4(vec3(0.55, 0.64, 0.9) * a, a * vA * 0.42);
}
`;

/* ---------- 3.5 Nebulosa de fundo (esfera invertida, muito escura) ---------- */
const NEBULA_VERT = /* glsl */`
varying vec3 vDir;
void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
`;
const NEBULA_FRAG = /* glsl */`
varying vec3 vDir;
${GLSL_SIMPLEX}
void main(){
  float n1 = fbm(vDir * 2.2);
  float n2 = fbm(vDir * 4.5 + 3.0);
  vec3 col = vec3(0.010, 0.012, 0.022);
  col += vec3(0.026, 0.014, 0.050) * smoothstep(0.05, 0.9, n1);
  col += vec3(0.006, 0.026, 0.040) * smoothstep(0.2, 0.95, n2);
  gl_FragColor = vec4(col, 1.0);
}
`;

/* ---------- 3.6 Casca da onda de choque ---------- */
const SHELL_VERT = /* glsl */`
varying vec3 vN; varying vec3 vV;
void main(){
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz);
  gl_Position = projectionMatrix * mv;
}
`;
const SHELL_FRAG = /* glsl */`
uniform vec3 uColor; uniform float uOpacity;
varying vec3 vN; varying vec3 vV;
void main(){
  float f = pow(max(1.0 - abs(dot(normalize(vN + 1e-6), normalize(vV + 1e-6))), 0.0), 3.0);
  gl_FragColor = vec4(uColor * f * 2.2, f * uOpacity);
}
`;

/* =====================================================================================
   4. UTILITÁRIOS
   ===================================================================================== */
// PRNG determinístico (mulberry32): o mesmo seed gera o mesmo layout
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const fold = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);

// Valida e normaliza o JSON de entrada: cria arestas não dirigidas e listas de adjacência
function normalizeData(raw){
  const cats = raw.categories || {};
  const byId = new Map();
  const nodes = (raw.nodes || []).map((n, i) => {
    const node = {
      id: String(n.id), name: String(n.name ?? n.id), category: String(n.category ?? 'outros'),
      weight: clamp(Number(n.weight ?? 0.5), 0, 1), idx: i, raw: n,
      links: [], adj: new Map()
    };
    byId.set(node.id, node);
    return node;
  });
  const edgeMap = new Map();
  for (const n of raw.nodes || []) {
    for (const c of n.connections || []) {
      const a = byId.get(String(n.id)), b = byId.get(String(c.id));
      if (!a || !b || a === b) continue;
      const key = a.idx < b.idx ? `${a.idx}|${b.idx}` : `${b.idx}|${a.idx}`;
      const prox = clamp(Number(c.proximity ?? 0.5), 0.1, 1);
      const prev = edgeMap.get(key);
      if (!prev || prev.proximity < prox) edgeMap.set(key, { a, b, proximity: prox });
    }
  }
  const edges = [...edgeMap.values()].map((e, i) => ({ ...e, idx: i, latent: e.proximity < LATENT_THRESHOLD }));
  for (const e of edges) {
    e.a.links.push({ node: e.b, edge: e, proximity: e.proximity });
    e.b.links.push({ node: e.a, edge: e, proximity: e.proximity });
    e.a.adj.set(e.b, e); e.b.adj.set(e.a, e);
  }
  for (const n of nodes) n.links.sort((x, y) => y.proximity - x.proximity);
  return { categories: cats, nodes, edges, byId };
}

// Cria um conjunto de N partículas como UMA InstancedBufferGeometry (1 draw call).
// Retorna os Float32Array crus para escrita direta por quadro, sem alocação.
const quadTemplate = new THREE.PlaneGeometry(1, 1);
function createGlowQuads(N, material, extra = {}){
  const geo = new THREE.InstancedBufferGeometry();
  geo.index = quadTemplate.index;
  geo.setAttribute('position', quadTemplate.attributes.position);
  const arrays = {};
  const def = { aOffset: 3, aColor: 3, aSize: 1, aAlpha: 1, ...extra };
  for (const [name, size] of Object.entries(def)) {
    if (!size) continue;
    const arr = new Float32Array(Math.max(1, N) * size);
    geo.setAttribute(name, new THREE.InstancedBufferAttribute(arr, size).setUsage(THREE.DynamicDrawUsage));
    arrays[name] = arr;
  }
  geo.instanceCount = N;
  const mesh = new THREE.Mesh(geo, material);
  mesh.frustumCulled = false;   // a bounding sphere do quad modelo não cobre as instâncias
  return { mesh, geo, arrays };
}
function markDirty(geo, names){ for (const n of names) geo.attributes[n].needsUpdate = true; }

/* =====================================================================================
   5. CENA, CÂMERA, RENDERER E PÓS-PROCESSAMENTO
   ===================================================================================== */
const container = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  document.getElementById('fallback').style.display = 'grid';
  throw err;
}
renderer.setPixelRatio(CFG.pixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x04050a, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 1200);
camera.position.set(-60, 40, 110);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 0.8;
controls.minDistance = 5;
controls.maxDistance = 140;
controls.autoRotate = !REDUCED;
controls.autoRotateSpeed = 0.32;

// Render target com MSAA (WebGL2) e meia precisão de ponto flutuante: bloom em HDR sem serrilhado.
// Renderizadores por software (SwiftShader, llvmpipe) geram blocos no bloom com MSAA em half float:
// nesses casos o MSAA fica desligado.
const SOFTWARE_GL = (() => {
  try {
    const gl = renderer.getContext(), ext = gl.getExtension('WEBGL_debug_renderer_info');
    const name = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    return /swiftshader|llvmpipe|software/i.test(String(name));
  } catch (e) { return false; }
})();
const rt = new THREE.WebGLRenderTarget(window.innerWidth * CFG.pixelRatio, window.innerHeight * CFG.pixelRatio,
  { type: THREE.HalfFloatType, samples: renderer.capabilities.isWebGL2 && !SOFTWARE_GL ? 4 : 0 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(CFG.pixelRatio);
composer.setSize(window.innerWidth, window.innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight),
  CFG.bloom.strength, CFG.bloom.radius, CFG.bloom.threshold);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());   // aplica tone mapping e conversão para sRGB

/* ---------- 5.1 Ambiente persistente (não depende do grafo) ---------- */
// Nebulosa
const nebula = new THREE.Mesh(
  new THREE.SphereGeometry(500, 48, 32),
  new THREE.ShaderMaterial({ vertexShader: NEBULA_VERT, fragmentShader: NEBULA_FRAG, side: THREE.BackSide, depthWrite: false })
);
scene.add(nebula);

// Poeira suspensa (quads instanciados, deriva na GPU)
const dust = (() => {
  const rnd = mulberry32(7);
  const n = CFG.dustCount;
  const m = new THREE.ShaderMaterial({
    vertexShader: DUST_VERT, fragmentShader: DUST_FRAG, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 } }
  });
  const q = createGlowQuads(n, m, { aOffset: 3, aSeed: 1, aColor: 0, aSize: 0, aAlpha: 0 });
  const pos = q.arrays.aOffset, seed = q.arrays.aSeed;
  for (let i = 0; i < n; i++) {
    // distribuição em casca esférica larga, mais densa perto do grafo
    const r = 8 + Math.pow(rnd(), 0.6) * 110;
    const th = rnd() * Math.PI * 2, ph = Math.acos(2 * rnd() - 1);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph) * 0.7;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
    seed[i] = rnd();
  }
  q.mesh.renderOrder = 0;
  scene.add(q.mesh);
  return q;
})();

// Material de partículas luminosas compartilhado entre fótons e disparo (1 programa de shader)
const glowMaterial = new THREE.ShaderMaterial({
  vertexShader: GLOW_QUAD_VERT, fragmentShader: GLOW_QUAD_FRAG,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});

// Pool do disparo sináptico: alocado uma vez, reaproveitado a cada clique (sem lixo para o GC)
const burst = (() => {
  const N = CFG.burstPool;
  const q = createGlowQuads(N, glowMaterial);
  q.mesh.renderOrder = 5;
  scene.add(q.mesh);
  return {
    N, q, pos: q.arrays.aOffset, col: q.arrays.aColor, size: q.arrays.aSize, alpha: q.arrays.aAlpha, cursor: 0,
    kind: new Uint8Array(N),          // 0 livre, 1 viaja pela sinapse, 2 onda radial
    edge: new Int32Array(N), fwd: new Int8Array(N), origin: new Int32Array(N),
    life: new Float32Array(N), dur: new Float32Array(N), base: new Float32Array(N),
    jit: new Float32Array(N * 3), rdir: new Float32Array(N * 3),
    c0: new Float32Array(N * 3), c1: new Float32Array(N * 3)
  };
})();

    blending: THREE.AdditiveBlending, uniforms: { uColor: { value: new THREE.Color() }, uOpacity: { value: 0 } } })
